name: Publish to PyPI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/tests.yml
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Verify release version
        run: |
          uv run --no-project python -c 'import os, tomllib; assert os.environ["GITHUB_REF_NAME"] == "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]'
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
